apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stress-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stress-node-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stress-node-reader
subjects:
- kind: ServiceAccount
  name: stress-sa
  namespace: stress
