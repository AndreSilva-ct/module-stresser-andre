apiVersion: v1
kind: ServiceAccount
metadata:
  name: stress-ui-sa
  namespace: stress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stress-ui-role
  namespace: stress
rules:
# submit workflows and read their status
- apiGroups: ["argoproj.io"]
  resources: ["workflows", "workflowtemplates"]
  verbs: ["create", "get", "list", "watch", "delete"]
# needed by Argo server to show pod logs in the UI
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stress-ui-rolebinding
  namespace: stress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stress-ui-role
subjects:
- kind: ServiceAccount
  name: stress-ui-sa
  namespace: stress
